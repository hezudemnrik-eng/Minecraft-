<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blueprint</title>
<link rel="icon" id="favicon" href="data:,">
<style>
/* ===== Design-Tokens ===== */
:root {
  color-scheme: dark;
  --bg: #121418;
  --surface: #1a1d23;
  --surface-2: #21252d;
  --surface-3: #2a2f39;
  --border: #2e333e;
  --border-2: #3b4150;
  --text: #e8eaef;
  --text-2: #b3b9c5;
  --text-3: #7b8292;
  --accent: #6cc04a;
  --accent-strong: #86d665;
  --accent-ink: #0d1909;
  --accent-soft: rgba(108, 192, 74, .14);
  --danger: #ef5350;
  --danger-soft: rgba(239, 83, 80, .14);
  --warn: #f5a524;
  --warn-soft: rgba(245, 165, 36, .14);
  --p1: #8a93a3;
  --p2: #4f9cf0;
  --p3: #f5a524;
  --p4: #ef5350;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-px: "Silkscreen", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --sidebar-w: 268px;
}
:root[data-accent="diamond"] { --accent: #3ad6cf; --accent-strong: #66e8e2; --accent-ink: #032220; --accent-soft: rgba(58, 214, 207, .14); }
:root[data-accent="redstone"] { --accent: #f0483e; --accent-strong: #ff6d64; --accent-ink: #ffffff; --accent-soft: rgba(240, 72, 62, .15); }
:root[data-accent="gold"] { --accent: #f2c230; --accent-strong: #ffd75e; --accent-ink: #241a00; --accent-soft: rgba(242, 194, 48, .14); }

/* ===== Grundlagen ===== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-strong); }
[hidden] { display: none !important; }
.px { font-family: var(--font-px); font-weight: 400; letter-spacing: .02em; }
.muted { color: var(--text-3); }
.small { font-size: 12px; }
.spacer { flex: 1; }
.px-icon { display: inline-flex; flex: none; }
.px-icon svg { display: block; }
.ui-icon { display: inline-flex; flex: none; }
.ui-icon svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

/* ===== Layout ===== */
#app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; }
#sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
#main { overflow: auto; min-width: 0; position: relative; }
.main-inner { padding: 24px 28px 48px; max-width: 1680px; margin: 0 auto; }

/* ===== Seitenleiste ===== */
.brand { display: flex; align-items: center; gap: 12px; padding: 20px 18px 16px; }
.brand-name { font-family: var(--font-px); font-size: 22px; line-height: 1; letter-spacing: .04em; }
.brand-sub { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.side-scroll { flex: 1; overflow: auto; padding: 4px 10px 12px; min-height: 0; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--text-2); text-decoration: none; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--text-3); }
.side-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 4px 6px 10px; }
.side-head span { font-family: var(--font-px); font-size: 12px; color: var(--text-3); letter-spacing: .06em; }
.side-group { font-size: 11px; color: var(--text-3); margin: 10px 10px 2px; text-transform: uppercase; letter-spacing: .06em; }
.proj-item { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: var(--radius-sm); color: var(--text-2); text-decoration: none; }
.proj-item:hover { background: var(--surface-2); color: var(--text); }
.proj-item.active { background: var(--surface-3); color: var(--text); box-shadow: inset 3px 0 0 var(--pc, var(--accent)); }
.proj-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-item .pct { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.proj-badge { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: color-mix(in srgb, var(--pc, var(--accent)) 22%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc, var(--accent)) 45%, transparent); flex: none; }
.proj-badge.big { width: 60px; height: 60px; border-radius: 12px; }
.side-empty { padding: 8px 10px; color: var(--text-3); font-size: 13px; }
.side-foot { border-top: 1px solid var(--border); padding: 10px; }
.side-tools { display: flex; gap: 6px; margin-top: 6px; }
.side-tools .btn { flex: 1; justify-content: center; }
.backup-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); padding: 8px 10px 2px; }
.backup-status .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--text-3); flex: none; }
.backup-status.ok .dot { background: var(--accent); }
.backup-status.warn .dot { background: var(--warn); }

/* ===== Buttons & Eingaben ===== */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text); cursor: pointer; white-space: nowrap; line-height: 1.2; }
.btn:hover { background: var(--surface-3); }
.btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .copy-chip:focus-visible, .card:focus-visible, .nav-item:focus-visible, .proj-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22), inset 0 2px 0 rgba(255, 255, 255, .22); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--text); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.danger-solid { background: var(--danger); border-color: transparent; color: #fff; font-weight: 600; }
.btn.small { padding: 5px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: var(--radius-sm); border: 0; background: transparent; color: var(--text-3); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn.danger-hover:hover { color: var(--danger); background: var(--danger-soft); }
.input, select.input, textarea.input { width: 100%; padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); background: #15181d; color: var(--text); outline: none; min-width: 0; }
.input:focus, textarea.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { resize: vertical; min-height: 90px; line-height: 1.5; }
input[type="number"].input { font-variant-numeric: tabular-nums; }
.input::placeholder, textarea::placeholder { color: var(--text-3); }
select.input { padding-right: 28px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: inline-flex; background: #15181d; border: 1px solid var(--border-2); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--text-2); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }

/* ===== Kopfbereiche ===== */
.view-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.view-head h1 { font-family: var(--font-px); font-weight: 400; font-size: 28px; line-height: 1.1; margin: 0; letter-spacing: .02em; word-break: break-word; }
.head-text { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 8px; }
.head-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; color: var(--text-2); }
.head-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.menu-toggle { display: none; }
h2.section { font-family: var(--font-px); font-weight: 400; font-size: 16px; margin: 0 0 12px; letter-spacing: .03em; display: flex; align-items: center; gap: 8px; }

/* ===== Banner & Toasts ===== */
.banners { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.banner { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border-2); flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.banner.danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.banner.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.banner .text { flex: 1; min-width: 200px; }
#toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 100; max-width: min(420px, calc(100vw - 36px)); }
.toast { display: flex; align-items: center; gap: 12px; background: var(--surface-3); border: 1px solid var(--border-2); border-radius: var(--radius); padding: 10px 12px 10px 14px; box-shadow: var(--shadow); animation: toast-in .18s ease-out; }
.toast.error { border-color: var(--danger); }
.toast .text { flex: 1; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

/* ===== Badges, Chips, Tags ===== */
.prio { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 7px 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: .04em; }
.prio::before { content: ""; width: 6px; height: 6px; background: currentColor; }
.prio.p1 { color: var(--p1); background: color-mix(in srgb, var(--p1) 14%, transparent); }
.prio.p2 { color: var(--p2); background: color-mix(in srgb, var(--p2) 14%, transparent); }
.prio.p3 { color: var(--p3); background: color-mix(in srgb, var(--p3) 14%, transparent); }
.prio.p4 { color: var(--p4); background: color-mix(in srgb, var(--p4) 16%, transparent); }
.due { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
.due.overdue { background: var(--danger-soft); color: #ff7b78; font-weight: 600; }
.due.soon { background: var(--warn-soft); color: #ffbf55; font-weight: 600; }
.due.done { opacity: .7; }
.status-pill { appearance: none; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text); border-radius: 999px; padding: 3px 26px 3px 12px; font-size: 13px; cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 14px) 52%, calc(100% - 10px) 52%; background-size: 4px 4px; background-repeat: no-repeat; }
.status-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.status-chip::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--sc, var(--text-3)); }
.st-bau { --sc: var(--accent); }
.st-planung { --sc: var(--p2); }
.st-pausiert { --sc: var(--p1); }
.st-fertig { --sc: #a7e08f; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); }
.tag.small { font-size: 11px; padding: 1px 7px; }
.tag-x { border: 0; background: none; color: var(--text-3); cursor: pointer; padding: 0 0 0 2px; font-size: 14px; line-height: 1; }
.tag-x:hover { color: var(--danger); }
.chip { border: 1px solid var(--border-2); background: transparent; color: var(--text-2); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--text); }

/* ===== Koordinaten ===== */
.loc { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.loc-main, .loc-conv { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; }
.loc-conv { font-size: 11px; }
.dim-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.dim-overworld { background: #6cc04a; }
.dim-nether { background: #e0493c; }
.dim-end { background: #d8d38a; }
.dim-name { font-size: 12px; color: var(--text-3); }
.copy-chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border-2); background: #15181d; color: var(--text); border-radius: 4px; padding: 1px 6px; font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; cursor: copy; }
.copy-chip:hover { border-color: var(--accent); }
.copy-chip b { color: var(--text-3); font-weight: 600; }
.copy-chip .ui-icon { color: var(--text-3); }
.copy-chip.small { font-size: 11px; padding: 0 5px; color: var(--text-2); }
.loc-editor { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.loc-editor > .coord-row, .loc-editor > .loc-hint { align-self: stretch; }
.coord-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; }
.coord-cell { position: relative; display: block; min-width: 0; }
.coord-cell span { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-family: var(--font-px); font-size: 11px; color: var(--text-3); pointer-events: none; }
.coord-cell .input { padding-left: 24px; }
.input[type="number"]::-webkit-inner-spin-button, .input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
.coord-row.corner-row { grid-template-columns: 24px repeat(3, minmax(0, 1fr)); }
.coord-row .corner { font-family: var(--font-px); color: var(--text-3); text-align: center; }
.loc-hint { font-size: 12px; color: var(--text-3); }

/* ===== Fortschrittsbalken (XP-Stil) ===== */
.bar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
.bar-label { color: var(--text-3); }
.bar-track { height: 8px; border-radius: 2px; background: #0c0e11; box-shadow: inset 0 0 0 1px #000, 0 0 0 1px var(--border); overflow: hidden; position: relative; min-width: 40px; }
.bar-fill { height: 100%; background: var(--accent); transition: width .25s; }
.bar-track::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9px, rgba(0, 0, 0, .45) 9px 10px); }
.bar.complete .bar-fill { background: var(--accent-strong); }
.bar-text { font-variant-numeric: tabular-nums; color: var(--text-2); min-width: 34px; text-align: right; }

/* ===== Board ===== */
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 18px 0 14px; }
.toolbar .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.toolbar select.input { width: auto; padding-top: 5px; padding-bottom: 5px; font-size: 13px; }
.toolbar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
.board { display: grid; grid-template-columns: repeat(3, minmax(280px, 1fr)); gap: 16px; align-items: start; overflow-x: auto; padding-bottom: 6px; }
.column { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 200px; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 14px; border-bottom: 1px solid var(--border); }
.col-head .title { font-family: var(--font-px); font-size: 15px; letter-spacing: .03em; }
.col-head .count { font-size: 12px; color: var(--text-3); background: var(--surface-3); padding: 1px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.col-head .col-mark { width: 10px; height: 10px; border-radius: 2px; }
.col-offen .col-mark { background: var(--p1); }
.col-arbeit .col-mark { background: var(--warn); }
.col-fertig .col-mark { background: var(--accent); }
.col-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 80px; transition: background .15s; }
.col-body.drag-over { background: var(--accent-soft); }
.col-empty { color: var(--text-3); font-size: 13px; text-align: center; padding: 18px 8px; border: 1px dashed var(--border-2); border-radius: var(--radius-sm); }
.col-foot { padding: 0 10px 10px; }
.quick-add { background: transparent; border: 1px dashed var(--border-2); }
.quick-add:focus { background: #15181d; border-style: solid; }
.drop-ph { height: 4px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); margin: -2px 0; }

/* ===== Karten ===== */
.card { position: relative; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px 10px 14px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; box-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
.card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 2px 2px 0; background: var(--pcol, var(--p2)); }
.card.prio-1 { --pcol: var(--p1); }
.card.prio-2 { --pcol: var(--p2); }
.card.prio-3 { --pcol: var(--p3); }
.card.prio-4 { --pcol: var(--p4); }
.card:hover { border-color: var(--border-2); background: #252a33; }
.card.dragging { opacity: .4; }
.card.done .card-title { color: var(--text-2); }
.card.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 2px var(--accent); } }
.card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card-title { font-weight: 600; font-size: 14px; line-height: 1.35; display: flex; gap: 6px; align-items: flex-start; word-break: break-word; }
.card-title .ui-icon { color: var(--accent); margin-top: 2px; }
.card-meta { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.card-bars { display: flex; flex-direction: column; gap: 5px; }
.card-icons { display: flex; gap: 10px; color: var(--text-3); font-size: 12px; }
.card-icons span { display: inline-flex; align-items: center; gap: 4px; }
.card.expanded { cursor: default; background: var(--surface-2); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); gap: 12px; padding: 12px 14px 14px 16px; }
.card-edit-head { display: flex; align-items: center; justify-content: space-between; margin: -2px -4px -4px 0; }
.card-edit-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 12px; }
.title-input { font-weight: 600; font-size: 15px; }

/* ===== Editoren ===== */
.md-editor { display: flex; flex-direction: column; gap: 6px; }
.md-preview { min-height: 60px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #15181d; }
.md { line-height: 1.55; word-break: break-word; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h3, .md h4, .md h5 { margin: 12px 0 6px; font-size: 15px; }
.md p { margin: 0 0 8px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
.md li.md-task { list-style: none; margin-left: -20px; }
.md code { background: var(--surface-3); padding: 1px 5px; border-radius: 4px; font: 12.5px ui-monospace, Consolas, monospace; }
.md pre { background: #0f1115; padding: 10px; border-radius: var(--radius-sm); overflow: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0 0 8px; padding: 4px 12px; border-left: 3px solid var(--border-2); color: var(--text-2); }
.md hr { border: 0; border-top: 1px solid var(--border-2); margin: 12px 0; }
.check-list { display: flex; flex-direction: column; gap: 4px; }
.check-item { display: grid; grid-template-columns: 22px 1fr 30px; align-items: center; gap: 4px; }
.check-item input[type="checkbox"], .md input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.check-item.done .input { text-decoration: line-through; color: var(--text-3); }
.check-item .input { border-color: transparent; background: transparent; padding: 4px 6px; }
.check-item .input:focus { background: #15181d; border-color: var(--accent); }
.mat-editor { display: flex; flex-direction: column; gap: 6px; }
.mat-head, .mat-row { display: grid; grid-template-columns: minmax(0, 1fr) 82px 82px 30px; gap: 6px; align-items: center; }
.mat-head { font-size: 11px; color: var(--text-3); padding: 0 2px; }
.mat-row { position: relative; padding-bottom: 5px; }
.mat-row-track { position: absolute; left: 0; right: 36px; bottom: 0; height: 3px; background: #0c0e11; border-radius: 2px; overflow: hidden; }
.mat-row-fill { height: 100%; background: var(--accent); }
.mat-row.complete .input.have { color: var(--accent-strong); }
.tags-editor { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tags-editor .tag-input { width: 150px; flex: 1; min-width: 120px; }
.links-editor { display: flex; flex-direction: column; gap: 6px; }
.link-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.link-row a { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.link-thumb { width: 44px; height: 32px; object-fit: cover; border-radius: 4px; background: var(--surface-3); flex: none; }
.add-row { display: flex; gap: 6px; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.icon-opt { display: grid; place-items: center; height: 44px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #15181d; cursor: pointer; }
.icon-opt:hover { border-color: var(--border-2); background: var(--surface-2); }
.icon-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--surface-2); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 28px; height: 28px; border-radius: 7px; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3); }
.swatch[aria-pressed="true"] { border-color: var(--text); }
.accent-opt { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); background: #15181d; cursor: pointer; color: var(--text); }
.accent-opt span.sw { width: 18px; height: 18px; border-radius: 4px; }
.accent-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

/* ===== Projekt-Ansicht ===== */
.proj-progress { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 24px; margin-top: 6px; max-width: 760px; }
.details { margin-top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.details-toggle { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; padding: 12px 14px; cursor: pointer; color: var(--text-2); text-align: left; }
.details-toggle:hover { color: var(--text); }
.details-toggle .chev { transition: transform .15s; }
.details-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.details-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; padding: 4px 16px 18px; }
.panel-title { font-size: 12px; color: var(--text-3); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; }
.archived-note { margin-bottom: 14px; }

/* ===== Tabellen ===== */
table.mat-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.mat-table th { text-align: left; font-weight: 500; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.mat-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.mat-table tr:last-child td { border-bottom: 0; }
.mat-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mat-table .miss { color: #ffbf55; font-weight: 600; }
.mat-table .okv { color: var(--accent-strong); }
.mat-table .mini { width: 90px; }

/* ===== Dashboard ===== */
.dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px 14px; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
.due-list { display: flex; flex-direction: column; }
.due-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 8px; border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 4px; }
.due-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
.due-main .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.due-sub { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.due-row:last-child { border-bottom: 0; }
.due-row:hover { background: var(--surface-2); }
.due-row .p { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12px; white-space: nowrap; }
.proj-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.proj-card { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); text-decoration: none; color: var(--text); }
.proj-card:hover { border-color: var(--border-2); background: #252a33; }
.proj-card .top { display: flex; align-items: center; gap: 10px; }
.proj-card .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { text-align: center; color: var(--text-3); padding: 18px; }
.onboard { max-width: 720px; margin: 40px auto; text-align: center; }
.onboard h1 { font-family: var(--font-px); font-weight: 400; font-size: 32px; margin: 18px 0 8px; }
.onboard .lead { color: var(--text-2); margin: 0 0 28px; font-size: 15px; }
.tips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; text-align: left; margin-bottom: 28px; }
.tip { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.tip .n { font-family: var(--font-px); color: var(--accent); font-size: 20px; }
.tip p { margin: 6px 0 0; color: var(--text-2); }

/* ===== Rezepte & Grundmaterialien ===== */
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-head h2.section { margin: 0; }
.base-block { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--border-2); border-radius: var(--radius-sm); background: #15181d; }
.base-head { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
.base-result { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.base-block .base-result { margin-top: 0; }
.base-block .mat-table { table-layout: fixed; font-size: 12.5px; }
.base-block .mat-table th, .base-block .mat-table td { padding: 5px 6px; }
.base-block .mat-table th { white-space: normal; letter-spacing: .02em; }
.base-block .mat-table th:not(:first-child), .base-block .mat-table td:not(:first-child) { width: 64px; }
.base-block .mat-table td:first-child { overflow-wrap: anywhere; }
.card .mat-head, .card .mat-row { grid-template-columns: minmax(0, 1fr) 62px 62px 26px; }
.card .mat-row-track { right: 32px; }
.steps-box summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
.craft-steps { margin: 6px 0 0; padding-left: 22px; color: var(--text-2); font-size: 13px; }
.craft-steps li { margin: 3px 0; }
.warn-note { color: #ffbf55; font-size: 12px; display: flex; align-items: center; gap: 4px; }
.calc-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 8px; }
.calc-empty { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.ing-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 30px; gap: 6px; align-items: center; }
.recipe-out { grid-template-columns: minmax(0, 1fr) 170px; }
.dlg-foot .spacer { flex: 1; }

/* ===== Daten übertragen ===== */
.transfer-panel { display: flex; flex-direction: column; gap: 10px; }
.transfer-panel h2.section { margin-bottom: 2px; }
.transfer-panel p { margin: 0; }
textarea.code-box { font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; word-break: break-all; min-height: 112px; resize: vertical; }
.steps { margin: 0; padding-left: 22px; color: var(--text-2); }
.steps li { margin: 6px 0; }

/* ===== Archiv & Papierkorb ===== */
.list-panel { display: flex; flex-direction: column; gap: 8px; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); flex-wrap: wrap; }
.list-row .info { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 2px; }
.list-row .ttl { font-weight: 600; overflow-wrap: anywhere; }
.list-row .sub { font-size: 12px; color: var(--text-3); }
.list-row .acts { display: flex; gap: 6px; }
.section-gap { margin-top: 28px; }

/* ===== Dialoge ===== */
dialog { border: 1px solid var(--border-2); border-radius: 14px; background: var(--surface); color: var(--text); padding: 0; box-shadow: var(--shadow); width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(5, 6, 8, .65); backdrop-filter: blur(2px); }
dialog.narrow { width: min(460px, calc(100vw - 32px)); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.dlg-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
.dlg-head h2 { margin: 0; font-family: var(--font-px); font-weight: 400; font-size: 18px; flex: 1; }
.dlg-body { padding: 16px 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.dlg-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--border); }
.dlg-body h3 { margin: 6px 0 0; font-size: 14px; }
.dlg-body p { margin: 0; color: var(--text-2); }
.help h3 { font-family: var(--font-px); font-weight: 400; font-size: 14px; color: var(--accent); margin-top: 10px; }
.help ul { margin: 4px 0 0; padding-left: 20px; color: var(--text-2); }
.help li { margin: 3px 0; }
.settings-group { display: flex; flex-direction: column; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.settings-group:last-child { border-bottom: 0; padding-bottom: 0; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: #ff7b78; font-size: 13px; }

/* ===== Schmale Fenster ===== */
@media (max-width: 1100px) {
  .dash-grid { grid-template-columns: 1fr; }
  .details-body { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; }
  #sidebar { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 50; transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); }
  body.side-open #sidebar { transform: none; }
  body.side-open #scrim { display: block; }
  .menu-toggle { display: inline-grid; }
  .main-inner { padding: 16px 16px 40px; }
  .board { grid-template-columns: repeat(3, minmax(270px, 86vw)); }
  .tips { grid-template-columns: 1fr; }
  .view-head h1 { font-size: 22px; }
  .grid2 { grid-template-columns: 1fr; }
}
#scrim { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 40; }

const store = {
  state: defaultState(),

  load() {
    let raw = null;

    if (!raw) { this.state = defaultState(); return; }
    try {
      this.state = normalize(JSON.parse(raw));
    } catch (e) {
      console.error('Gespeicherte Daten konnten nicht gelesen werden', e);
      try { localStorage.setItem(`${STORAGE_KEY}:defekt-${Date.now()}`, raw); } catch (_) { /* voll */ }
      this.state = defaultState();
      setTimeout(() => toast('Gespeicherte Daten waren beschädigt. Eine Kopie wurde aufbewahrt, bitte ein Backup laden.', { error: true, timeout: 12000 }), 300);
    }
  },
  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
    } catch (e) {
      console.error(e);
      toast('Speichern fehlgeschlagen: ' + e.message, { error: true });
    }
    this.listeners.forEach(fn => fn(this.state));

    }
    if (!line.trim()) { flushPara(); flushQuote(); closeList(); continue; }
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) {
      flushPara(); flushQuote(); closeList();
      const lvl = m[1].length + 2;
      out.push(`<h${lvl}>${mdInline(m[2])}</h${lvl}>`);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); flushQuote(); closeList(); out.push('<hr>'); continue; }
    if ((m = line.match(/^&gt;\s?(.*)$/))) { flushPara(); closeList(); quote.push(m[1]); continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      flushPara(); flushQuote(); openList('ul');
      const tm = m[1].match(/^\[( |x|X)\]\s+(.*)$/);
      out.push(tm ? `<li class="md-task"><input type="checkbox" disabled${tm[1] === ' ' ? '' : ' checked'}> ${mdInline(tm[2])}</li>` : `<li>${mdInline(m[1])}</li>`);
      continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); flushQuote(); openList('ol'); out.push(`<li>${mdInline(m[1])}</li>`); continue; }
    flushQuote(); closeList();
    para.push(line);
  }
  flushPara(); flushQuote(); closeList();
  return out.join('');
}

/* ===== Rendern mit erhaltenem Fokus ===== */
function withFocusPreserved(fn) {
  const a = document.activeElement;
  const key = a && a.dataset ? a.dataset.fkey : null;
  let ss = null, se = null;
  try { ss = a.selectionStart; se = a.selectionEnd; } catch (_) { /* kein Textfeld */ }
  const scrolls = $$('[data-skey]').map(el => [el.dataset.skey, el.scrollTop, el.scrollLeft]);
  fn();
  for (const [k, t, l] of scrolls) {
    const el = document.querySelector(`[data-skey="${CSS.escape(k)}"]`);
    if (el) { el.scrollTop = t; el.scrollLeft = l; }
  }
  const want = ui.pendingFocus || key;
  ui.pendingFocus = null;
  if (want) {
    const el = document.querySelector(`[data-fkey="${CSS.escape(want)}"]`);
    if (el) {
      el.focus({ preventScroll: want === key });
      if (want === key && ss != null) { try { el.setSelectionRange(ss, se); } catch (_) { /* egal */ } }
    }
  }
}

function render() {

    renderSidebar();

  if (ui.scrollToTask) {

}

/* Fortschrittsbalken */
function bar(kind, id) {
  const el = h('div', { class: 'bar', dataset: { bar: `${kind}:${id}` } });
  fillBar(el);
  return el;
}
function barValue(kind, id) {
  if (kind === 'task-mat') {
    const t = taskById(id);
    if (!t) return null;
    const m = materialTotals(t.materials);
    return m.need ? { pct: m.have / m.need, label: 'Material', text: pctText(m.have / m.need), title: `${fmtNum(m.have)} / ${fmtNum(m.need)}` } : null;
  }
  if (kind === 'task-check') {
    const t = taskById(id);
    if (!t || !t.checklist.length) return null;
    const d = t.checklist.filter(c => c.done).length;
    return { pct: d / t.checklist.length, label: 'Checkliste', text: `${d}/${t.checklist.length}` };
  }
  const p = projectById(id);
  if (!p) return null;
  if (kind === 'proj-mat') {
    const m = rowsTotals(projectMaterials(p));
    return m.need ? { pct: m.have / m.need, label: 'Material', text: pctText(m.have / m.need), title: `${fmtNum(m.have)} / ${fmtNum(m.need)} gesammelt` } : null;
  }
  if (kind === 'proj-tasks') {
    const ts = tasksOf(p.id);
    const d = ts.filter(isDone).length;
    return { pct: ts.length ? d / ts.length : 0, label: 'Aufgaben', text: `${d}/${ts.length}` };
  }
  return null;
}
function fillBar(el) {
  const [kind, id] = el.dataset.bar.split(':');
  const v = barValue(kind, id);
  if (!v) { el.hidden = true; el.replaceChildren(); return; }
  el.hidden = false;
  el.classList.toggle('complete', v.pct >= 1);
  el.title = v.title || '';
  el.replaceChildren(h('span', { class: 'bar-label' }, v.label),
    h('div', { class: 'bar-track' }, h('div', { class: 'bar-fill', style: { width: `${Math.round(Math.min(1, v.pct) * 100)}%` } })),
    h('span', { class: 'bar-text' }, v.text));
}
function projectPctText(p) {
  const ts = tasksOf(p.id);
  return ts.length ? pctText(ts.filter(isDone).length / ts.length) : '–';
}

/* Drag & Drop */
let dragId = null;
function wireDrop(body, p, col) {
  body.addEventListener('dragover', e => {
    if (!dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    body.classList.add('drag-over');
    let ph = $('.drop-ph', body);
    if (!ph) { $$('.drop-ph').forEach(x => x.remove()); ph = h('div', { class: 'drop-ph' }); }
    const before = $$('.card:not(.dragging)', body).find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
    if (before) { if (ph.nextElementSibling !== before) body.insertBefore(ph, before); }
    else if (body.lastElementChild !== ph) body.append(ph);
  });
  body.addEventListener('dragleave', e => {
    if (!body.contains(e.relatedTarget)) { body.classList.remove('drag-over'); $('.drop-ph', body)?.remove(); }
  });
  body.addEventListener('drop', e => {
    e.preventDefault();
    body.classList.remove('drag-over');
    const t = taskById(dragId || e.dataTransfer.getData('text/plain'));
    const ph = $('.drop-ph', body);
    if (!t || !ph) { ph?.remove(); return; }
    const sib = (el, dir) => { let n = el[dir]; while (n && (!n.classList.contains('card') || n.classList.contains('dragging'))) n = n[dir]; return n; };
    const prev = sib(ph, 'previousElementSibling'), next = sib(ph, 'nextElementSibling');
    const po = prev ? taskById(prev.dataset.id).order : null, no = next ? taskById(next.dataset.id).order : null;
    t.order = po != null && no != null ? (po + no) / 2 : po != null ? po + 1 : no != null ? no - 1 : 0;
    if (t.column !== col) {
      t.completedAt = col === 'fertig' ? nowIso() : null;
      t.column = col;
    }
    touch(t);
    columnTasks(p.id, col).forEach((x, i) => { if (x.order !== i) { x.order = i; touch(x); } });
    dragId = null;
    commit();
  });
}

function locationEditor(obj, ctx) {
  const k = ctx.key;
  const l = obj.location;
  const setType = v => {
    const old = obj.location;
    if (v === 'none') obj.location = null;
    else if (v === 'point') obj.location = { type: 'point', dim: old?.dim || 'overworld', x: old?.x ?? old?.x1 ?? null, y: old?.y ?? old?.y1 ?? null, z: old?.z ?? old?.z1 ?? null };
    else obj.location = { type: 'area', dim: old?.dim || 'overworld', x1: old?.x ?? old?.x1 ?? null, y1: old?.y ?? old?.y1 ?? null, z1: old?.z ?? old?.z1 ?? null, x2: old?.x2 ?? null, y2: old?.y2 ?? null, z2: old?.z2 ?? null };
    ctx.changed();
    ctx.rerender();
  };
  const wrap = h('div', { class: 'loc-editor' },
    segmented([{ v: 'none', label: 'Keine' }, { v: 'point', label: 'Punkt' }, { v: 'area', label: 'Bereich' }], l ? l.type : 'none', setType, `${k}-loctype`));
  if (!l) return wrap;
  const hint = h('div', { class: 'loc-hint' });
  const upd = () => { hint.textContent = convText(obj.location); };
  const num = (f, ax) => h('label', { class: 'coord-cell' }, h('span', null, ax),
    h('input', { class: 'input', type: 'number', step: '1', inputmode: 'numeric', placeholder: ax === 'Y' ? 'opt.' : '', value: isNum(l[f]) ? String(l[f]) : '', 'data-fkey': `${k}-loc-${f}`,
      onInput: e => { l[f] = numOrNull(e.target.value); upd(); ctx.changed(); } }));
  wrap.append(segmented(DIMS, l.dim, v => { l.dim = v; ctx.changed(); ctx.rerender(); }, `${k}-loc-dim`));
  if (l.type === 'point') {
    wrap.append(h('div', { class: 'coord-row' }, num('x', 'X'), num('y', 'Y'), num('z', 'Z')));
  } else {
    wrap.append(
      h('div', { class: 'coord-row corner-row' }, h('span', { class: 'corner', title: 'Ecke A' }, 'A'), num('x1', 'X'), num('y1', 'Y'), num('z1', 'Z')),
      h('div', { class: 'coord-row corner-row' }, h('span', { class: 'corner', title: 'Ecke B' }, 'B'), num('x2', 'X'), num('y2', 'Y'), num('z2', 'Z')));
  }
  upd();
  wrap.append(hint);
  return wrap;
}

function markdownEditor(obj, ctx) {
  const k = `${ctx.key}-md`;
  const mode = ui.mdMode[k] || 'edit';
  const setMode = m => { ui.mdMode[k] = m; ctx.rerender(); };
  const wrap = h('div', { class: 'md-editor' }, segmented([{ v: 'edit', label: 'Bearbeiten' }, { v: 'preview', label: 'Vorschau' }], mode, setMode, k));
  if (mode === 'edit') {
    wrap.append(h('textarea', { class: 'input', rows: 4, value: obj.descriptionMd, 'data-fkey': `${k}-text`,
      placeholder: 'Details … **fett**, *kursiv*, - Liste, [Link](https://…)', onInput: e => { obj.descriptionMd = e.target.value; ctx.changed(); } }));
  } else {
    const prev = h('div', { class: 'md-preview md' });
    prev.innerHTML = obj.descriptionMd.trim() ? mdToHtml(obj.descriptionMd) : '<p class="muted">Noch nichts geschrieben.</p>';
    wrap.append(prev);
  }
  return wrap;
}

function checklistEditor(t, ctx) {

    const row = h('div', { class: 'check-item' + (c.done ? ' done' : '') },

function materialsEditor(list, ctx) {
  const k = ctx.key;
  const wrap = h('div', { class: 'mat-editor' });
  if (list.length) wrap.append(h('div', { class: 'mat-head' }, h('span', null, 'Material'), h('span', null, 'Benötigt'), h('span', null, 'Gesammelt'), h('span')));

    const fill = h('div', { class: 'mat-row-fill' });

    const upd = () => {
      const pct = m.needed ? Math.min(1, m.have / m.needed) : 0;

      row.classList.toggle('complete', m.needed > 0 && m.have >= m.needed);
    };
    const num = (f, cls) => h('input', { class: 'input ' + cls, type: 'number', min: '0', step: '1', inputmode: 'numeric', placeholder: '0', value: m[f] ? String(m[f]) : '', 'data-fkey': `${k}-mat-${m.id}-${f}`,

      h('input', { class: 'input', value: m.name, placeholder: 'z. B. Stein', list: 'dl-material', autocomplete: 'off', 'data-fkey': `${k}-mat-${m.id}-name`,

      h('button', { class: 'icon-btn danger-hover', title: 'Material entfernen', onClick: () => { list.splice(i, 1); ctx.changed(); ctx.rerender(); } }, sym('x', 14)),
      h('div', { class: 'mat-row-track' }, fill));
    upd();
    wrap.append(row);

  wrap.append(h('div', null, h('button', { type: 'button', class: 'btn ghost small', 'data-fkey': `${k}-mat-add`,
    onClick: () => { const m = { id: uid(), name: '', needed: 0, have: 0 }; list.push(m); ctx.changed(); ui.pendingFocus = `${k}-mat-${m.id}-name`; ctx.rerender(); } },
    sym('plus', 14), 'Material hinzufügen')));
  return wrap;
}

function tagsEditor(t, ctx) {

const isImageUrl = u => /\.(png|jpe?g|gif|webp|bmp|avif)(\?.*)?$/i.test(u);

/* ===== Aktionen ===== */
function setProjectStatus(p, v) {
  p.status = v;
  touch(p);
  commit();
  if (v === 'fertig' && !p.archived) toast(`„${p.name}“ ist fertig.`, { action: { label: 'Ins Archiv', fn: () => archiveProject(p) } });
}
function archiveProject(p) {
  p.archived = true;
  touch(p);
  ui.route = { view: 'dashboard' };
  history.replaceState(null, '', '#/');
  commit();
  toast(`„${p.name}“ archiviert.`, { action: { label: 'Rückgängig', fn: () => unarchiveProject(p, true) } });
}
function unarchiveProject(p, open) {
  p.archived = false;
  touch(p);
  commit();
  if (open) go(`#/p/${encodeURIComponent(p.id)}`);
}
function trashProject(p) {
  const ts = tasksOf(p.id);
  confirmDialog(`„${p.name}“ mit ${ts.length} Aufgabe${ts.length === 1 ? '' : 'n'} in den Papierkorb verschieben? Du kannst es ${TRASH_DAYS} Tage lang wiederherstellen.`,
    { title: 'Projekt löschen', ok: 'In Papierkorb', danger: true }).then(yes => {
    if (!yes) return;
    const now = nowIso();
    p.deletedAt = now;
    touch(p);
    ts.forEach(t => { t.deletedAt = now; t.deletedWithProject = true; touch(t); });
    if (ui.route.view === 'project' && ui.route.id === p.id) { ui.route = { view: 'dashboard' }; history.replaceState(null, '', '#/'); }
    commit();
    toast(`„${p.name}“ liegt im Papierkorb.`, { action: { label: 'Wiederherstellen', fn: () => restoreProject(p) } });
  });
}
function restoreProject(p) {
  p.deletedAt = null;
  touch(p);
  S().tasks.forEach(t => { if (t.projectId === p.id && t.deletedWithProject) { t.deletedAt = null; t.deletedWithProject = false; touch(t); } });
  commit();
}
function trashTask(t) {
  t.deletedAt = nowIso();
  t.deletedWithProject = false;
  touch(t);
  if (ui.expandedTaskId === t.id) ui.expandedTaskId = null;
  commit();
  toast(`„${t.title || 'Aufgabe'}“ liegt im Papierkorb.`, { action: { label: 'Wiederherstellen', fn: () => restoreTask(t) } });
}
function restoreTask(t) {
  t.deletedAt = null;
  touch(t);
  const p = projectById(t.projectId);
  if (p && p.deletedAt) { restoreProject(p); toast(`Projekt „${p.name}“ wurde mit wiederhergestellt.`); }
  commit();
}
function archiveTasks(list) {
  const ids = list.map(t => t.id);
  list.forEach(t => { t.archived = true; touch(t); });
  if (ids.includes(ui.expandedTaskId)) ui.expandedTaskId = null;
  commit();
  toast(`${ids.length} Aufgabe${ids.length === 1 ? '' : 'n'} archiviert.`, { action: { label: 'Rückgängig', fn: () => {
    ids.forEach(id => { const t = taskById(id); if (t) { t.archived = false; touch(t); } });
    commit();
  } } });
}
function unarchiveTask(t) {
  t.archived = false;
  t.column = 'fertig';
  touch(t);
  commit();
}
function purgeTrash() {
  const cutoff = Date.now() - TRASH_DAYS * DAY_MS;
  const old = iso => iso && new Date(iso).getTime() < cutoff;
  const goneProjects = new Set(S().projects.filter(p => old(p.deletedAt)).map(p => p.id));
  const before = S().projects.length + S().tasks.length;
  S().projects = S().projects.filter(p => !goneProjects.has(p.id));
  S().tasks = S().tasks.filter(t => !goneProjects.has(t.projectId) && !old(t.deletedAt));
  const removed = before - S().projects.length - S().tasks.length;
  const recipesBefore = S().recipes.length;
  S().recipes = S().recipes.filter(r => !old(r.deletedAt));
  if (removed || S().recipes.length !== recipesBefore) store.save();
  return removed;
}

/* ----- Archiv ----- */
function renderArchive(root, menuBtn, banners) {
  const projs = sortedProjects(liveProjects().filter(p => p.archived));
  const tasks = S().tasks.filter(t => t.archived && !t.deletedAt).filter(t => { const p = projectById(t.projectId); return p && !p.deletedAt && !p.archived; });
  root.append(h('header', { class: 'view-head' }, menuBtn, h('div', { class: 'head-text' }, h('h1', null, 'Archiv'),
    h('div', { class: 'muted' }, 'Fertige Projekte und archivierte Aufgaben. Hier kannst du sie zurückholen oder löschen.'))), banners);
  root.append(h('h2', { class: 'section' }, 'Archivierte Projekte'));
  root.append(projs.length ? h('div', { class: 'list-panel' }, projs.map(p => h('div', { class: 'list-row' },
    projBadge(p, 22),
    h('div', { class: 'info' }, h('span', { class: 'ttl' }, p.name || '(ohne Namen)'),
      h('span', { class: 'sub' }, `${tasksOf(p.id).length} Aufgaben · ${label(STATUSES, p.status)}`)),
    h('div', { class: 'acts' },
      h('a', { class: 'btn small ghost', href: `#/p/${encodeURIComponent(p.id)}` }, 'Ansehen'),
      h('button', { class: 'btn small', onClick: () => unarchiveProject(p, true) }, sym('restore', 14), 'Zurückholen'),
      h('button', { class: 'btn small ghost danger', onClick: () => trashProject(p) }, sym('trash', 14), 'Löschen')))))
    : h('div', { class: 'empty panel' }, 'Keine archivierten Projekte.'));
  root.append(h('h2', { class: 'section section-gap' }, 'Archivierte Aufgaben'));
  if (!tasks.length) { root.append(h('div', { class: 'empty panel' }, 'Keine archivierten Aufgaben.')); return; }
  const byProj = new Map();
  tasks.forEach(t => { (byProj.get(t.projectId) || byProj.set(t.projectId, []).get(t.projectId)).push(t); });
  for (const [pid, list] of byProj) {
    const p = projectById(pid);
    root.append(h('div', { class: 'side-group', style: { margin: '14px 2px 6px', display: 'flex', 'align-items': 'center', gap: '8px' } }, projBadge(p, 14), p.name));
    root.append(h('div', { class: 'list-panel' }, list.map(t => h('div', { class: 'list-row' },
      prioBadge(t.priority),
      h('div', { class: 'info' }, h('span', { class: 'ttl' }, t.title || '(ohne Titel)'),
        h('span', { class: 'sub' }, t.completedAt ? `Erledigt am ${new Date(t.completedAt).toLocaleDateString('de-DE')}` : 'Erledigt')),
      h('div', { class: 'acts' },
        h('button', { class: 'btn small', onClick: () => unarchiveTask(t) }, sym('restore', 14), 'Zurück nach „Fertig“'),
        h('button', { class: 'btn small ghost danger', onClick: () => trashTask(t) }, sym('trash', 14), 'Löschen'))))));
  }
}

/* ----- Papierkorb ----- */
function renderTrash(root, menuBtn, banners) {
  const items = [
    ...S().projects.filter(p => p.deletedAt).map(p => ({ kind: 'p', at: p.deletedAt, p })),
    ...S().tasks.filter(t => t.deletedAt && !t.deletedWithProject).map(t => ({ kind: 't', at: t.deletedAt, t, p: projectById(t.projectId) }))
  ].sort((a, b) => b.at.localeCompare(a.at));
  root.append(h('header', { class: 'view-head' }, menuBtn,
    h('div', { class: 'head-text' }, h('h1', null, 'Papierkorb'), h('div', { class: 'muted' }, `Gelöschtes wird nach ${TRASH_DAYS} Tagen automatisch endgültig entfernt.`)),
    items.length ? h('div', { class: 'head-actions' }, h('button', { class: 'btn ghost danger', onClick: emptyTrash }, sym('trash', 15), 'Papierkorb leeren')) : null), banners);
  if (!items.length) { root.append(h('div', { class: 'empty panel' }, 'Der Papierkorb ist leer.')); return; }
  const left = at => { const d = TRASH_DAYS - daysAgo(at); return d <= 0 ? 'wird heute endgültig gelöscht' : `noch ${d} Tag${d === 1 ? '' : 'e'}`; };
  const ago = at => { const d = daysAgo(at); return d === 0 ? 'heute gelöscht' : d === 1 ? 'gestern gelöscht' : `vor ${d} Tagen gelöscht`; };
  root.append(h('div', { class: 'list-panel' }, items.map(it => it.kind === 'p'
    ? h('div', { class: 'list-row' }, projBadge(it.p, 22),
      h('div', { class: 'info' }, h('span', { class: 'ttl' }, it.p.name || '(ohne Namen)'),
        h('span', { class: 'sub' }, `Projekt inkl. ${S().tasks.filter(t => t.projectId === it.p.id && t.deletedWithProject).length} Aufgaben · ${ago(it.at)} · ${left(it.at)}`)),
      h('div', { class: 'acts' },
        h('button', { class: 'btn small', onClick: () => restoreProject(it.p) }, sym('restore', 14), 'Wiederherstellen'),
        h('button', { class: 'btn small ghost danger', onClick: () => deleteForever(it) }, 'Endgültig löschen')))
    : h('div', { class: 'list-row' }, prioBadge(it.t.priority),
      h('div', { class: 'info' }, h('span', { class: 'ttl' }, it.t.title || '(ohne Titel)'),
        h('span', { class: 'sub' }, `Aufgabe in „${it.p ? it.p.name : '?'}“ · ${ago(it.at)} · ${left(it.at)}`)),
      h('div', { class: 'acts' },
        h('button', { class: 'btn small', onClick: () => restoreTask(it.t) }, sym('restore', 14), 'Wiederherstellen'),
        h('button', { class: 'btn small ghost danger', onClick: () => deleteForever(it) }, 'Endgültig löschen'))))));
}
function deleteForever(it) {
  const name = it.kind === 'p' ? it.p.name : it.t.title;
  confirmDialog(`„${name || 'Eintrag'}“ endgültig löschen? Das kann nicht rückgängig gemacht werden.`, { title: 'Endgültig löschen', ok: 'Löschen', danger: true }).then(yes => {
    if (!yes) return;
    if (it.kind === 'p') { S().projects = S().projects.filter(p => p.id !== it.p.id); S().tasks = S().tasks.filter(t => t.projectId !== it.p.id); }
    else S().tasks = S().tasks.filter(t => t.id !== it.t.id);
    commit();
  });
}
function emptyTrash() {
  confirmDialog('Alles im Papierkorb endgültig löschen? Das kann nicht rückgängig gemacht werden.', { title: 'Papierkorb leeren', ok: 'Alles löschen', danger: true }).then(yes => {
    if (!yes) return;
    const gone = new Set(S().projects.filter(p => p.deletedAt).map(p => p.id));
    S().projects = S().projects.filter(p => !p.deletedAt);
    S().tasks = S().tasks.filter(t => !t.deletedAt && !gone.has(t.projectId));
    commit();
  });
}

/* ===== Formulare (Modal) ===== */
function dlgShell(title, body, foot) {
  return h('div', { class: 'dlg' },
    h('div', { class: 'dlg-head' }, h('h2', null, title), h('button', { class: 'icon-btn', title: 'Schließen', onClick: () => modal.close() }, sym('x', 16))),
    h('div', { class: 'dlg-body', 'data-skey': 'dlg-body' }, body),
    foot ? h('div', { class: 'dlg-foot' }, foot) : null);
}
function openTaskModal(p) {
  const draft = newTask(p.id, 'offen');
  let error = '';
  const ctx = { key: 'm-task', changed() { scheduleRefresh(); }, rerender() { modal.rerender(); } };
  const submit = () => {
    if (!draft.title.trim()) { error = 'Bitte einen Titel eingeben.'; ui.pendingFocus = 'm-task-title'; modal.rerender(); return; }
    const col = columnTasks(p.id, draft.column);
    draft.order = col.length ? col[col.length - 1].order + 1 : 0;
    if (draft.column === 'fertig') draft.completedAt = nowIso();
    draft.createdAt = draft.updatedAt = nowIso();
    S().tasks.push(draft);
    modal.close();
    commit();
    toast(`Aufgabe „${draft.title}“ angelegt.`);
  };
  ui.pendingFocus = 'm-task-title';
  modal.open(() => dlgShell('Neue Aufgabe', [
    h('p', { class: 'muted' }, 'Im Projekt „', p.name, '“'),
    field('Spalte', segmented(COLUMNS, draft.column, v => { draft.column = v; modal.rerender(); }, 'm-task-col')),
    taskEditorFields(draft, ctx),
    error ? h('div', { class: 'err' }, error) : null
  ], [
    h('button', { class: 'btn ghost', onClick: () => modal.close() }, 'Abbrechen'),
    h('button', { class: 'btn primary', onClick: submit }, sym('plus', 15), 'Anlegen')
  ]));
}
function openProjectModal(p) {
  const isNew = !p;
  const draft = isNew ? newProject() : JSON.parse(JSON.stringify(p));
  let error = '';
  const ctx = { key: 'm-proj', changed() {}, rerender() { modal.rerender(); } };
  const submit = () => {
    if (!draft.name.trim()) { error = 'Bitte einen Namen eingeben.'; ui.pendingFocus = 'm-proj-name'; modal.rerender(); return; }
    draft.name = draft.name.trim();
    if (isNew) {
      draft.createdAt = draft.updatedAt = nowIso();
      S().projects.push(draft);
      store.save();
      modal.close();
      ui.pendingFocus = 'quick-offen';

/* ===== IndexedDB (für den Backup-Ordner) ===== */
const kv = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('blueprint', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(key) {
    const db = await this.open();
    return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  async set(key, val) {
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  }
};

/* ===== Backup & Wiederherstellung ===== */
const BACKUP_RE = /^blueprint-backup-\d{4}-\d{2}-\d{2}\.json$/;
function exportData() {
  flushSave();
  const { projects, tasks, recipes, settings } = S();
  return { app: 'blueprint', schemaVersion: SCHEMA_VERSION, exportedAt: nowIso(), data: { settings: { accent: settings.accent }, projects, tasks, recipes } };
}
function markBackup() { S().settings.lastBackupDate = todayStr(); store.save(); }
async function chooseBackupDir() {
  let dir;
  try { dir = await window.showDirectoryPicker({ id: 'blueprint-backup', mode: 'readwrite' }); }
  catch (e) { if (e.name !== 'AbortError') toast('Ordner konnte nicht gewählt werden: ' + e.message, { error: true }); return; }
  try { await kv.set('backupDir', dir); } catch (e) { toast('Ordner konnte nicht gemerkt werden: ' + e.message, { error: true }); }
  S().settings.backupDirName = dir.name;
  store.save();
  await writeBackup(dir).then(() => { hideBanner('backup'); toast(`Backup-Ordner „${dir.name}“ eingerichtet, erstes Backup gespeichert.`); })
    .catch(e => toast('Backup fehlgeschlagen: ' + e.message, { error: true }));
  render();
}
async function ensurePermission(dir, ask) {
  const opts = { mode: 'readwrite' };
  if (await dir.queryPermission(opts) === 'granted') return true;
  return ask ? (await dir.requestPermission(opts)) === 'granted' : false;
}
async function writeBackup(dir) {
  const fh = await dir.getFileHandle(`blueprint-backup-${todayStr()}.json`, { create: true });
  const w = await fh.createWritable();
  await w.write(JSON.stringify(exportData(), null, 2));
  await w.close();
  const names = [];
  for await (const [name, entry] of dir.entries()) if (entry.kind === 'file' && BACKUP_RE.test(name)) names.push(name);
  names.sort();
  while (names.length > BACKUP_KEEP) await dir.removeEntry(names.shift());
  markBackup();
}
async function backupNow(ask) {
  let dir = null;
  try { dir = await kv.get('backupDir'); } catch (_) { /* egal */ }
  if (!dir) return chooseBackupDir();
  try {
    if (!(await ensurePermission(dir, ask))) { toast('Kein Zugriff auf den Backup-Ordner erlaubt.', { error: true }); return; }
    await writeBackup(dir);
    hideBanner('backup');
    toast(`Backup gespeichert in „${dir.name}“.`);
    render();
  } catch (e) {
    console.error(e);
    toast('Backup fehlgeschlagen. Ist der Ordner noch da?', { error: true, action: { label: 'Ordner wählen', fn: chooseBackupDir } });
  }
}

/* ===== Daten übertragen (Code zum Kopieren & Einfügen) ===== */
const CODE_PREFIX = 'BLUEPRINT1:';
const canCompress = () => typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
function bytesToB64url(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlToBytes(str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function encodeTransfer() {
  const json = JSON.stringify(exportData());
  if (!canCompress()) return json;
  const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
  return CODE_PREFIX + bytesToB64url(new Uint8Array(await new Response(stream).arrayBuffer()));
}
async function decodeTransfer(text) {
  const t = text.trim();
  if (t.startsWith('{')) return JSON.parse(t);
  const compact = t.replace(/\s+/g, '');
  if (!compact.startsWith(CODE_PREFIX)) throw new Error('Das ist kein Blueprint-Code. Er beginnt immer mit „BLUEPRINT1:“.');
  if (!canCompress()) throw new Error('Dieser Browser kann den Code nicht entpacken. Bitte Browser aktualisieren oder eine Backup-Datei nutzen.');
  let json;
  try {
    const stream = new Blob([b64urlToBytes(compact.slice(CODE_PREFIX.length))]).stream().pipeThrough(new DecompressionStream('gzip'));
    json = await new Response(stream).text();
  } catch (_) {
    throw new Error('Der Code ist unvollständig oder beschädigt. Bitte den kompletten Code kopieren und erneut einfügen.');
  }
  return JSON.parse(json);
}
function unwrapPayload(obj) {
  const data = obj && obj.app === 'blueprint' && obj.data ? obj.data : obj;
  return data && Array.isArray(data.projects) && Array.isArray(data.tasks) ? data : null;
}
function mergeState(local, incoming) {
  const count = { added: 0, updated: 0, same: 0 };
  const time = x => Date.parse(x.updatedAt) || 0;
  for (const key of ['projects', 'tasks', 'recipes']) {
    const index = new Map(local[key].map((x, i) => [x.id, i]));
    for (const item of incoming[key]) {
      const i = index.get(item.id);
      if (i == null) { index.set(item.id, local[key].push(item) - 1); count.added++; }
      else if (time(item) > time(local[key][i])) { local[key][i] = item; count.updated++; }
      else count.same++;
    }
  }
  return count;
}
async function importPayload(data, { kind, exportedAt }) {
  const incoming = normalize(data);
  const when = exportedAt ? ` vom ${new Date(exportedAt).toLocaleString('de-DE')}` : '';
  const what = `${kind}${when} mit ${incoming.projects.length} Projekt(en) und ${incoming.tasks.length} Aufgabe(n)${recipeCountText(incoming.recipes.length)}`;
  let mode;
  if (!hasData()) {
    mode = (await confirmDialog(`${what} übernehmen?`, { title: `${kind} laden`, ok: 'Übernehmen' })) ? 'replace' : null;
  } else {
    mode = await choiceDialog([
      `${what} laden. Auf diesem Gerät sind schon ${S().projects.length} Projekt(e) und ${S().tasks.length} Aufgabe(n)${recipeCountText(S().recipes.length)}.`,
      '„Zusammenführen“ ergänzt Neues und übernimmt bei gleichen Einträgen die zuletzt geänderte Version. „Alles ersetzen“ überschreibt den Stand auf diesem Gerät.'
    ], { title: `${kind} laden`, choices: [{ v: 'replace', label: 'Alles ersetzen', cls: 'danger-solid' }, { v: 'merge', label: 'Zusammenführen', cls: 'primary', autofocus: true }] });
  }
  if (!mode) return false;
  flushSave();
  try { localStorage.setItem(`${STORAGE_KEY}:vor-import`, JSON.stringify(S())); } catch (_) { /* voll */ }
  let msg;
  if (mode === 'merge') {
    const c = mergeState(S(), incoming);
    store.save();
    msg = `Zusammengeführt: ${c.added} neu, ${c.updated} aktualisiert, ${c.same} unverändert.`;
  } else {
    const keep = { lastBackupDate: S().settings.lastBackupDate, backupDirName: S().settings.backupDirName };
    store.replace({ ...incoming, settings: { ...incoming.settings, ...keep } });
    msg = `${kind} geladen.`;
  }
  ui.expandedTaskId = null;
  ui.importText = '';
  ui.importError = '';
  ui.exportCode = null;
  modal.close();
  applyAccent();
  go('#/');
  render();
  toast(msg);
  return true;
}
async function importFromText() {
  const text = ui.importText.trim();
  const fail = m => { ui.importError = m; ui.pendingFocus = 'transfer-import'; render(); };
  if (!text) return fail('Bitte zuerst einen Code einfügen.');
  let obj;
  try { obj = await decodeTransfer(text); } catch (e) {
    return fail(e instanceof SyntaxError ? 'Der Text ist kein gültiger Blueprint-Code. Bitte den kompletten Code kopieren und erneut einfügen.' : e.message);
  }
  const data = unwrapPayload(obj);
  if (!data) return fail('Der Code enthält keine Blueprint-Daten.');
  ui.importError = '';
  await importPayload(data, { kind: 'Übertragungs-Code', exportedAt: obj.exportedAt });
}

    h('div', { class: 'btn-row' }, h('button', { class: 'btn primary', 'data-fkey': 'transfer-import-btn', onClick: importFromText }, sym('check', 15), 'Importieren')));
  const how = h('section', { class: 'panel wide' },
    h('h2', { class: 'section' }, sym('help', 16), 'So geht’s: Handy → Laptop'),
    h('ol', { class: 'steps' },
      h('li', null, 'Auf dem Handy: hier auf „Teilen…“ tippen und den Code an dich selbst schicken (E-Mail, WhatsApp, AirDrop) – oder „Kopieren“ und in eine Notiz einfügen.'),
      h('li', null, 'Auf dem Laptop: Blueprint öffnen → „Daten übertragen“ → den Code ins Feld „Importieren“ einfügen.'),
      h('li', null, 'Auf „Importieren“ klicken. Hat der Laptop schon Daten, wählst du „Zusammenführen“ oder „Alles ersetzen“.')));
  root.append(h('div', { class: 'dash-grid' }, exportPanel, importPanel, how));
}

/* ===== Rezeptbuch ===== */
function calcResult() {
  const name = ui.calc.name.trim();
  const qty = Math.max(0, Number(ui.calc.qty) || 0);
  if (!name || !qty) return h('p', { class: 'muted' }, 'Item und Menge eingeben.');
  const index = recipeIndex();
  if (!index.has(nameKey(name))) {
    return h('div', { class: 'calc-empty' }, h('p', { class: 'muted' }, `„${name}“ hat kein Rezept – es zählt selbst als Grundmaterial.`),
      h('button', { class: 'btn small', onClick: () => openRecipeModal(null, name) }, sym('plus', 14), `Rezept für „${name}“ anlegen`));
  }
  const res = expandDemand([{ name, qty }], index);
  return h('div', { class: 'base-result' },
    h('table', { class: 'mat-table' },
      h('thead', null, h('tr', null, h('th', null, 'Grundmaterial'), h('th', { class: 'num' }, 'Menge'))),
      h('tbody', null, res.base.map(b => h('tr', null, h('td', null, b.name, b.cyclic ? h('span', { class: 'muted', title: 'Kreislauf im Rezept' }, ' ⟳') : null), h('td', { class: 'num' }, fmtNum(b.qty)))))),
    cycleNote(res.cycles),
    h('div', { class: 'panel-title', style: { margin: '6px 0 0' } }, 'Bauplan'),
    h('ol', { class: 'craft-steps' }, res.steps.map(st => h('li', null, stepText(st)))));
}
function renderRecipes(root, menuBtn, banners) {
  const list = liveRecipes().sort((a, b) => a.output.localeCompare(b.output, 'de'));
  root.append(h('header', { class: 'view-head' }, menuBtn,
    h('div', { class: 'head-text' }, h('h1', null, 'Rezepte'),
      h('div', { class: 'muted' }, 'Trage ein, woraus etwas hergestellt wird – Blueprint rechnet Materiallisten dann in Grundmaterialien um.')),
    h('div', { class: 'head-actions' }, h('button', { class: 'btn primary', 'data-fkey': 'recipe-new', onClick: () => openRecipeModal(null) }, sym('plus'), 'Neues Rezept'))), banners);

  const result = h('div', { class: 'calc-result' }, calcResult());
  const upd = () => result.replaceChildren(calcResult());
  const calcPanel = h('section', { class: 'panel transfer-panel' },
    h('h2', { class: 'section' }, iconEl('crafting', 16), 'Rechner'),
    h('div', { class: 'calc-row' },
      h('input', { class: 'input', placeholder: 'Item, z. B. Steinziegeltreppe', list: 'dl-material', autocomplete: 'off', value: ui.calc.name, 'data-fkey': 'calc-name',
        onInput: e => { ui.calc.name = e.target.value; upd(); } }),
      h('input', { class: 'input', type: 'number', min: '1', step: '1', inputmode: 'numeric', placeholder: 'Menge', value: String(ui.calc.qty || ''), 'data-fkey': 'calc-qty',
        onInput: e => { ui.calc.qty = Math.max(0, numOrNull(e.target.value) || 0); upd(); } })),
    result);

  const listPanel = h('section', { class: 'panel transfer-panel' },
    h('h2', { class: 'section' }, sym('text', 16), `Rezeptbuch (${list.length})`),
    list.length ? h('div', { class: 'list-panel' }, list.map(r => h('div', { class: 'list-row recipe-row' },
      h('div', { class: 'info' },
        h('span', { class: 'ttl' }, `${fmtNum(r.qty)}× ${r.output || '(ohne Namen)'}`),
        h('span', { class: 'sub' }, '← ' + r.inputs.map(i => `${fmtNum(i.qty)}× ${i.name}`).join(' + ') + ` · ${label(STATIONS, r.station)}`)),
      h('div', { class: 'acts' },
        h('button', { class: 'btn small', 'data-fkey': `recipe-edit-${r.id}`, onClick: () => openRecipeModal(r) }, sym('edit', 14), 'Bearbeiten'),
        h('button', { class: 'btn small ghost danger', 'data-fkey': `recipe-del-${r.id}`, onClick: () => deleteRecipe(r) }, sym('trash', 14), 'Löschen')))))
      : h('div', { class: 'empty' }, 'Noch keine Rezepte. Beispiel: „4× Steinziegel ← 4× Stein (Werkbank)“ und „1× Stein ← 1× Bruchstein (Ofen)“.'));
  root.append(h('div', { class: 'dash-grid' }, calcPanel, listPanel));
}
function deleteRecipe(r) {
  r.deletedAt = nowIso();
  touch(r);
  commit();
  toast(`Rezept „${r.output}“ gelöscht.`, { action: { label: 'Rückgängig', fn: () => { r.deletedAt = null; touch(r); commit(); } } });
}
function openRecipeModal(r, presetOutput) {
  const isNew = !r;
  const draft = isNew ? newRecipe() : JSON.parse(JSON.stringify(r));
  if (presetOutput) draft.output = presetOutput;
  if (!draft.inputs.length) draft.inputs.push({ id: uid(), name: '', qty: 1 });
  let error = '';
  const submit = () => {
    const output = draft.output.trim();
    const k = nameKey(output);
    const merged = new Map();
    for (const i of draft.inputs) {
      const ik = nameKey(i.name);
      if (!ik) continue;
      if (merged.has(ik)) merged.get(ik).qty += i.qty; else merged.set(ik, { id: i.id, name: i.name.trim(), qty: Math.max(1, i.qty || 1) });
    }
    const inputs = [...merged.values()];
    if (!k) error = 'Bitte angeben, was hergestellt wird.';
    else if (!inputs.length) error = 'Bitte mindestens eine Zutat eintragen.';
    else if (merged.has(k)) error = 'Eine Zutat darf nicht das Ergebnis selbst sein.';
    else if (liveRecipes().some(x => x.id !== draft.id && nameKey(x.output) === k)) error = `Für „${output}“ gibt es schon ein Rezept. Bearbeite bitte das vorhandene.`;
    else error = '';
    if (error) { modal.rerender(); return; }
    const fields = { output, qty: Math.max(1, draft.qty || 1), station: draft.station, inputs };
    if (isNew) S().recipes.push({ ...draft, ...fields, createdAt: nowIso(), updatedAt: nowIso() });
    else { Object.assign(r, fields); touch(r); }
    modal.close();
    commit();
    toast(isNew ? `Rezept „${output}“ gespeichert.` : `Rezept „${output}“ aktualisiert.`);
  };
  ui.pendingFocus = 'm-rec-out';
  modal.open(() => dlgShell(isNew ? 'Neues Rezept' : 'Rezept bearbeiten', [
    h('div', { class: 'grid2 recipe-out' },
      field('Ergebnis', h('input', { class: 'input title-input', value: draft.output, placeholder: 'z. B. Steinziegel', list: 'dl-material', autocomplete: 'off', 'data-fkey': 'm-rec-out',
        onInput: e => { draft.output = e.target.value; } })),
      field('Menge pro Herstellung', h('input', { class: 'input', type: 'number', min: '1', step: '1', inputmode: 'numeric', value: String(draft.qty), 'data-fkey': 'm-rec-qty',
        onInput: e => { draft.qty = Math.max(1, numOrNull(e.target.value) || 1); } }))),
    field('Station', segmented(STATIONS, draft.station, v => { draft.station = v; modal.rerender(); }, 'm-rec-st')),
    field('Zutaten pro Herstellung', h('div', { class: 'mat-editor' },
      draft.inputs.map((i, idx) => h('div', { class: 'ing-row' },
        h('input', { class: 'input', value: i.name, placeholder: 'z. B. Stein', list: 'dl-material', autocomplete: 'off', 'data-fkey': `m-rec-in-${i.id}-name`,
          onInput: e => { i.name = e.target.value; } }),
        h('input', { class: 'input', type: 'number', min: '1', step: '1', inputmode: 'numeric', value: String(i.qty), 'data-fkey': `m-rec-in-${i.id}-qty`,
          onInput: e => { i.qty = Math.max(1, numOrNull(e.target.value) || 1); } }),
        h('button', { class: 'icon-btn danger-hover', title: 'Zutat entfernen', onClick: () => { draft.inputs.splice(idx, 1); if (!draft.inputs.length) draft.inputs.push({ id: uid(), name: '', qty: 1 }); modal.rerender(); } }, sym('x', 14)))),
      h('div', null, h('button', { type: 'button', class: 'btn ghost small', 'data-fkey': 'm-rec-add',
        onClick: () => { const i = { id: uid(), name: '', qty: 1 }; draft.inputs.push(i); ui.pendingFocus = `m-rec-in-${i.id}-name`; modal.rerender(); } }, sym('plus', 14), 'Zutat hinzufügen')))),
    h('p', { class: 'small muted' }, 'Beispiel Treppe: Ergebnis „Steinziegeltreppe“, Menge 4, Zutat 6× „Steinziegel“. Namen ohne Rezept zählen als Grundmaterial.'),
    error ? h('div', { class: 'err' }, error) : null
  ], [
    isNew ? null : h('button', { class: 'btn ghost danger', onClick: () => { modal.close(); deleteRecipe(r); } }, sym('trash', 15), 'Löschen'),
    h('span', { class: 'spacer' }),
    h('button', { class: 'btn ghost', onClick: () => modal.close() }, 'Abbrechen'),
    h('button', { class: 'btn primary', 'data-fkey': 'm-rec-save', onClick: submit }, 'Speichern')
  ]));
}

/* ===== Start ===== */
function init() {
  loadPrefs();
  store.load();
  const purged = purgeTrash();
  applyAccent();
  ui.route = parseRoute();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) { /* egal */ }

  window.addEventListener('hashchange', () => {
    ui.route = parseRoute();
    ui.expandedTaskId = null;
    if (ui.route.view !== 'transfer') { ui.exportCode = null; ui.importText = ''; ui.importError = ''; }
    document.body.classList.remove('side-open');
    $('#main').scrollTop = 0;
    render();
  });
  // Klick außerhalb einer aufgeklappten Karte klappt sie zu
  document.addEventListener('click', e => {
    if (!ui.expandedTaskId || !e.target.isConnected) return;
    if (e.target.closest('.card.expanded, dialog, .toast, #toasts')) return;
    collapseTask();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.expandedTaskId && !$('#modal').open && !$('#confirm').open) collapseTask();
  });
  $('#modal').addEventListener('close', () => { modal.build = null; });
  $('#scrim').addEventListener('click', () => document.body.classList.remove('side-open'));
  // Änderungen aus einem anderen Tab übernehmen
  window.addEventListener('storage', e => {
    if (e.key !== STORAGE_KEY) return;
    store.load();
    applyAccent();
    render();
  });
  window.addEventListener('beforeunload', flushSave);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });

  render();
  if (purged) toast(`${purged === 1 ? '1 Eintrag' : `${purged} Einträge`} aus dem Papierkorb endgültig entfernt (älter als ${TRASH_DAYS} Tage).`);
  dailyBackupCheck();
  // Falls die App über Mitternacht offen bleibt
  let lastDay = todayStr();
  setInterval(() => {
    if (todayStr() === lastDay) return;
    lastDay = todayStr();
    ui.dueBannerDismissed = false;
    if (purgeTrash()) store.save();
    render();
    dailyBackupCheck();
  }, 5 * 60 * 1000);
}
init();
</script>
